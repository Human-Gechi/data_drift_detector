<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title><b>Data Drift Alert</b></title>
    <style>
        body { font-family: Arial, sans-serif; }
        .header {
        color: #fff;
        background: linear-gradient(90deg, #d9534f 60%, #c9302c 100%);
        padding: 16px 24px;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        border-radius: 6px 6px 0 0;
        box-shadow: 0 2px 8px rgba(217, 83, 79, 0.15);
        text-align: center;
        text-transform: uppercase;
        }
        .timestamp { color: #888; font-size: 12px; }
        .content { margin-top: 20px; }
        .drift-report { background: #f9f9f9; border-left: 4px solid #d9534f; padding: 10px; font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body>
    <div class="header">DATA DRIFT ALERT</div>
    <div class="timestamp"><b>Timestamp: {{ timestamp }}</b></div>
    <div class="content">
        <p><b>Drift detected in the following tables:</b></p>
        <div class="drift-report">{{ drift_report | replace('\n', '<br>') | safe }}</div>
    </div>
</body>
</html>
